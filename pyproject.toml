[project]
name = "notinha-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tcunha2004", email = "tcunha2004@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.44.10",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.165.0",
    "google-auth[requests]>=2.63.1",
    "langchain>=1.5.2",
    "langchain-aws>=1.10.0",
    "langgraph>=1.2.24",
    "python-dotenv>=1.2.4",
    "redis>=8.2.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.41.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
